name: Build Unified Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-pipeline
      - cmp-rewrite
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Nuvio + Cloudstream APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Runtime Properties
        run: |
          cat << 'EOF' > local.properties
          NUVIO_SUPABASE_URL=https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Android APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Cloudstream-Unified-APK
          path: androidApp/build/outputs/apk/full/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/build-pipeline' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.0-unified-${{ github.run_number }}"
          name: "Nuvio + Cloudstream Unified Release v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 🚀 Nuvio + Cloudstream Unified Mobile Streaming App
            
            **Key Features in this Release:**
            - **Dual-Engine Streaming**: Stremio / Real-Debrid cached torrents + Cloudstream zero-cost web link extractors (`StreamTape`, `FileMoon`, `Mixdrop`).
            - **Netflix-Style Visual Interface**: Modern OLED black `#121212` aesthetic, cinematic hero trailers, horizontal carousels, and frosted glass stream picker.
            - **AndroidX Media3 & MPV**: Sub-second buffer initiation, hardware decoding, and ASS/SSA stylized subtitle rendering.
            - **Universal Sync**: TMDB / Cinemeta catalog with Trakt & Simkl scrobbling.
            
            **Installation:**
            Download the `.apk` file below and sideload it directly onto your Android device.
          draft: false
          prerelease: false
          files: androidApp/build/outputs/apk/full/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
